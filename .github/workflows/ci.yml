name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.0"

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: uv sync --dev

      - name: black 코드 포맷 검사
        run: uv run python -m black --check .

      - name: isort import 순서 검사
        run: uv run python -m isort --check-only .

      - name: flake8 코드 품질 검사
        run: uv run python -m flake8 .

      - name: Django 테스트 실행
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "True"
        run: uv run python manage.py test
