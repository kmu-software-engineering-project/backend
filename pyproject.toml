[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
    venv
  | migrations
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = ["venv", "migrations"]

[tool.flake8]
max-line-length = 88
exclude = venv, migrations, __pycache__
extend-ignore = E203, W503
